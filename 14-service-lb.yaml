apiVersion: v1
kind: service-lb
metadata:
  name: nginx-lb
  labels: service-lb-demo
spec:
  selector:
    purpose: service-lb-demo
    project: roboshop
    environment: dev
  ports:
    - protocol: TCP
      port: 80
      targetport: 80

---
apiVersion: v1
kind: Pod
metadata:
  name: nginx-lb
  labels:
    purpose: nginx-lb-demo
    project: roboshop
    environment: dev
spec:
  containers:
    - name: nginx
      image: nginx

    